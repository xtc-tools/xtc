name: XTC Build and Tests

# Runs on pushes targeting the main branch, pull request and manual Actions tab
on:
  push:
    branches: ["main"]
    tags: ["xtc-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run-tests:
        description: Run the test matrix before building the package
        type: boolean
        required: true
        default: true
      run-pages:
        description: Build the Pages preview
        type: boolean
        required: true
        default: true
      publish-testpypi:
        description: Publish the package to TestPyPI
        type: boolean
        required: true
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs['run-tests'])
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps: &build-steps
      - name: Checkout XTC Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure PR has linear history
        if: github.event_name == 'pull_request'
        run: |
          MERGE_COMMITS="$(git rev-list --merges "${GITHUB_SHA}"^1.."${GITHUB_SHA}"^2)"
          if [ -n "${MERGE_COMMITS}" ]; then
            echo "::error::PR contains merges, always use rebase for updating branches: Merge commits: ${MERGE_COMMITS}" >&2
            exit 1
          fi
      - name: Compute test cache identity
        id: test-cache-identity
        run: |
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          CACHE_NAME="xtc-tests-v1-${TREE_SHA}-${{ matrix.os }}-py${{ matrix.python-version }}"
          echo "tree-sha=${TREE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "cache-name=${CACHE_NAME}" >>"${GITHUB_OUTPUT}"
      - name: Look up cached test results
        id: test-cache
        env:
          CACHE_NAME: ${{ steps.test-cache-identity.outputs.cache-name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "hit=false" >>"${GITHUB_OUTPUT}"
          ARTIFACTS="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --raw-field name="${CACHE_NAME}" \
              --raw-field per_page=100 \
              --jq '.artifacts[] | select(.expired == false) | [.created_at, .workflow_run.id] | @tsv'
          )"
          RUN_ID="$(printf '%s\n' "${ARTIFACTS}" | sort -r | head -n 1 | cut -f 2)"
          if [ -n "${RUN_ID}" ]; then
            echo "hit=true" >>"${GITHUB_OUTPUT}"
            echo "run-id=${RUN_ID}" >>"${GITHUB_OUTPUT}"
          fi
      - name: Download cached test results
        if: steps.test-cache.outputs.hit == 'true'
        uses: actions/download-artifact@v6
        with:
          name: ${{ steps.test-cache-identity.outputs.cache-name }}
          path: xtc-test-cache
          repository: ${{ github.repository }}
          run-id: ${{ steps.test-cache.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Validate cached test results
        if: steps.test-cache.outputs.hit == 'true'
        env:
          TREE_SHA: ${{ steps.test-cache-identity.outputs.tree-sha }}
        run: |
          MANIFEST=xtc-test-cache/manifest.txt
          test "$(grep '^schema=' "${MANIFEST}")" = "schema=v1"
          test "$(grep '^tree=' "${MANIFEST}")" = "tree=${TREE_SHA}"
          test "$(grep '^os=' "${MANIFEST}")" = "os=${{ matrix.os }}"
          test "$(grep '^python=' "${MANIFEST}")" = "python=${{ matrix.python-version }}"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            test -d xtc-test-cache/artifacts
            rm -rf artifacts
            mv xtc-test-cache/artifacts artifacts
          fi
          {
            echo "### Test result cache"
            echo "- Result: hit"
            echo "- Tree: \`${TREE_SHA}\`"
            echo "- Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ steps.test-cache.outputs.run-id }}"
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Report test cache miss
        if: steps.test-cache.outputs.hit != 'true'
        env:
          TREE_SHA: ${{ steps.test-cache-identity.outputs.tree-sha }}
        run: |
          {
            echo "### Test result cache"
            echo "- Result: miss"
            echo "- Tree: \`${TREE_SHA}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Install Linux Packages
        if: steps.test-cache.outputs.hit != 'true' && runner.os == 'Linux'
        # Note: package cache with awalsh128/cache-apt-pkgs-action does not work correctly, use standard install.
        run: |
          sudo apt install -y build-essential libomp5 binutils-aarch64-linux-gnu binutils-x86-64-linux-gnu libpfm4-dev
      - name: Install macOS Packages
        if: steps.test-cache.outputs.hit != 'true' && runner.os == 'macOs'
        run: |
          brew install libomp x86_64-linux-gnu-binutils aarch64-elf-binutils
          export DYLD_LIBRARY_PATH="/opt/homebrew/opt/libomp/lib:${DYLD_LIBRARY_PATH}"
      - name: Set up Python ${{ matrix.python-version }}
        if: steps.test-cache.outputs.hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install XTC Package in dev mode
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          pip install -e .[dev]
      - name: Dump Environment information
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          python -c 'import sys; print(sys.version)'
          pip list
          env | sort
      - name: Run Checks
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          COV=scripts/coverage/coverage_run.sh
          $COV make check
      - name: Run Explore One Shot
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          COV=scripts/coverage/coverage_run.sh
          env STRATEGIES=tile8dvr BACKENDS="tvm mlir" $COV ./scripts/explore/run-explore-one-shot.sh artifacts/explore-one-shot
      - name: Run Explore Variants
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          COV=scripts/coverage/coverage_run.sh
          env STRATEGIES=tile8dvr BACKENDS="tvm mlir" $COV ./scripts/explore/run-explore-variants.sh artifacts/explore-variants
          env NOSHOW=1 scripts/explore/display-explore-variants.sh artifacts/explore
      - name: Run Explore Optimizers
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          COV=scripts/coverage/coverage_run.sh
          env TRIALS=20 BATCH=4 SEEDS="1 2 3" scripts/explore/run-explore-optimizers.sh artifacts/explore-optimizers
      - name: Generate Coverage Reports
        if: steps.test-cache.outputs.hit != 'true'
        run: |
          coverage combine >/dev/null
          coverage report
          mkdir -p artifacts/coverage
          coverage xml -o artifacts/coverage/coverage.xml
          coverage report --format=markdown >artifacts/coverage/coverage.md
          coverage html -d artifacts/coverage/html
      - name: Publish artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: artifacts-os-${{ matrix.os }}
          path: artifacts/
      - name: Publish Coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: artifacts/coverage/coverage.xml
          flags: py${{ matrix.python-version }}-${{ matrix.os }}
          name: py${{ matrix.python-version }}-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          skip_validation: true
          fail_ci_if_error: true
      - name: Prepare test result cache
        if: steps.test-cache.outputs.hit != 'true'
        env:
          TREE_SHA: ${{ steps.test-cache-identity.outputs.tree-sha }}
        run: |
          rm -rf xtc-test-cache
          mkdir xtc-test-cache
          {
            echo "schema=v1"
            echo "tree=${TREE_SHA}"
            echo "os=${{ matrix.os }}"
            echo "python=${{ matrix.python-version }}"
          } >xtc-test-cache/manifest.txt
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            cp -R artifacts xtc-test-cache/artifacts
          fi
      - name: Cache successful test results
        if: steps.test-cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.test-cache-identity.outputs.cache-name }}
          path: xtc-test-cache/
          if-no-files-found: error
          retention-days: 30

  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python-version: ["3.12"]
    steps: *build-steps

  build-package:
    name: Build Python package
    if: >
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (
        needs.build.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          !inputs['run-tests'] &&
          needs.build.result == 'skipped'
        )
      )
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XTC Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^xtc-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags must have the form xtc-vX.Y.Z"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
      - name: Build and check package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: make wheel
      - name: Upload package distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pages:
    name: Build and deploy Pages
    needs: [build, pr-build]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs['run-pages']) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.pr-build.result == 'success' || needs.pr-build.result == 'skipped')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages.yml

  publish-testpypi:
    name: Publish development package to TestPyPI
    if: >
      always() &&
      needs.build-package.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs['publish-testpypi'])
      )
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xtc-tools
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish release package to PyPI
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/xtc-v')
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xtc-tools
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
